name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/Tangerine.Core.Tests -c Release

      - name: Publish single-file exe
        run: >
          dotnet publish src/Tangerine/Tangerine.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=$("${{ github.ref_name }}".TrimStart('v'))
          -o out/Tangerine

      - name: Bundle ffmpeg
        run: ./scripts/fetch-ffmpeg.ps1 -Destination out/Tangerine/tools

      - name: Zip
        run: |
          Copy-Item README.md out/Tangerine/
          Compress-Archive -Path out/Tangerine/* -DestinationPath "Tangerine-${{ github.ref_name }}-win-x64.zip"

      - uses: softprops/action-gh-release@v2
        with:
          files: Tangerine-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true
