name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # 태그 없이 손으로 돌리면 설치 파일까지만 만들어 Actions 의 Artifacts 에 둔다 (Releases 에는 올리지 않음)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          "VERSION=$v" >> $env:GITHUB_ENV

      - name: Test
        run: dotnet test tests/Citrus.Core.Tests -c Release

      - name: Hancom module
        run: ./scripts/fetch-hancom.ps1

      - name: Publish single-file exe
        run: >
          dotnet publish src/Citrus/Citrus.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None
          -p:Version=$env:VERSION
          -o out/Citrus

      - name: Bundle ffmpeg
        run: ./scripts/fetch-ffmpeg.ps1 -Destination out/Citrus/tools

      - name: Installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:VERSION" installer\Citrus.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC 실패 ($LASTEXITCODE)" }

      - name: Zip and guide
        run: |
          Copy-Item README.md out/Citrus/
          Copy-Item docs/citrus-guide.pdf out/Citrus/
          Compress-Archive -Path out/Citrus/* -DestinationPath "out/Citrus-v$env:VERSION-win-x64.zip"
          Copy-Item docs/citrus-guide.pdf "out/Citrus-Guide-v$env:VERSION.pdf"

      - name: Keep build (manual run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: citrus-test-build
          path: |
            out/Citrus-Setup-v*.exe
            out/Citrus-v*-win-x64.zip
            out/Citrus-Guide-v*.pdf

      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          name: 시트러스 ${{ github.ref_name }}
          body_path: installer/release-notes.md
          files: |
            out/Citrus-Setup-v*.exe
            out/Citrus-v*-win-x64.zip
            out/Citrus-Guide-v*.pdf
